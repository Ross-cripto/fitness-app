name: Momentum
options:
  bundleIdPrefix: com.momentum
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Momentum:
    type: application
    platform: iOS
    sources:
      - Momentum
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.momentum.app
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_LANGUAGE: en
        INFOPLIST_KEY_CFBundleDisplayName: Momentum
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Momentum reads your steps, active energy and body weight from Apple Health to show your progress."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Momentum saves your finished workouts and body weight to Apple Health."
    entitlements:
      path: Momentum/Momentum.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
  MomentumTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MomentumTests
    dependencies:
      - target: Momentum
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.momentum.app.tests
  MomentumUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - MomentumUITests
    dependencies:
      - target: Momentum
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.momentum.app.uitests
schemes:
  Momentum:
    build:
      targets:
        Momentum: all
    test:
      targets:
        - MomentumTests
  MomentumScreenshots:
    build:
      targets:
        Momentum: all
    test:
      targets:
        - MomentumUITests
