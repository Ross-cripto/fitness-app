name: App screenshots

# Runs the real app in the simulator with demo data in English, Spanish and Portuguese and saves a screenshot of every
# main screen as a downloadable artifact of the run (Actions tab > this run > Artifacts > screenshots).
# It doubles as a launch smoke test.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# A newer push makes older runs pointless.
concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Pick a simulator
        id: sim
        run: echo "udid=$(.github/scripts/pick-simulator.sh)" >> "$GITHUB_OUTPUT"
      - name: Run the screenshot tests
        run: |
          xcodebuild test \
            -project Momentum.xcodeproj \
            -scheme MomentumScreenshots \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath "$RUNNER_TEMP/screens.xcresult" \
            CODE_SIGNING_ALLOWED=NO
      - name: Export screenshots
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/raw" shots
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/screens.xcresult" --output-path "$RUNNER_TEMP/raw" || true
          python3 .github/scripts/collect-screenshots.py "$RUNNER_TEMP/raw" shots
          ls -la shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots
